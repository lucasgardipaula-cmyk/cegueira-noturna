<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Flashcards interativos sobre Cegueira Noturna (Nictalopia)">
  <title>Flashcards · Cegueira Noturna (Nictalopia)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Cegueira Noturna</h1>
      <p class="subtitle">Nictalopia — Flashcards interativos</p>
      <p class="hint">Clique ou pressione Enter/Espaço em um cartão para revelar a resposta</p>
    </div>
  </header>

  <main class="container">
    <section class="flashcards-grid" id="flashcards" aria-label="Flashcards sobre Nictalopia">
      <!-- Cartões gerados via JavaScript -->
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Conteúdo educativo · Não substitui consulta médica</p>
    </div>
  </footer>

  <script>
    // ============================================
    //  DADOS DOS FLASHCARDS
    //  Para criar novos cartões, basta adicionar
    //  objetos neste array.
    // ============================================
    const flashcards = [
      {
        front: "O que é Cegueira Noturna (Nictalopia)?",
        back: "É a dificuldade ou incapacidade de enxergar em locais com pouca iluminação. Não é uma doença isolada, mas um sintoma de condições subjacentes que afetam a retina."
      },
      {
        front: "Quais células dos olhos são afetadas?",
        back: "Afeta os <strong>bastonetes</strong>, fotorreceptores da retina responsáveis pela visão periférica e em ambientes escuros. A deficiência de rodopsina (pigmento visual) impede essa adaptação."
      },
      {
        front: "O que pode causar a Nictalopia?",
        back: "Deficiência severa de Vitamina A, Retinose Pigmentar, Catarata, Miopia elevada, Glaucoma e complicações do Diabetes (Retinopatia Diabética)."
      },
      {
        front: "Qual a relação com a Vitamina A?",
        back: "A deficiência de Vitamina A é a principal causa evitável de cegueira infantil no mundo, afetando milhões de crianças, especialmente em países em desenvolvimento (dados OMS)."
      },
      {
        front: "Existe tratamento ou cura?",
        back: "Depende da causa! Casos por deficiência nutricional tratam-se com suplementação. Para causas genéticas (como a Retinose Pigmentar), a Terapia Gênica (ex: Luxturna) já é uma realidade promissora."
      },
      {
        front: "Como prevenir ou diagnosticar?",
        back: "Diagnostica-se via exames de fundo de olho e eletrorretinografia. A prevenção inclui alimentação rica em Vitamina A (cenoura, espinafre, ovos) e consultas oftalmológicas regulares."
      }
    ];

    // ============================================
    //  GERAÇÃO DOS CARTÕES
    // ============================================
    const grid = document.getElementById('flashcards');

    flashcards.forEach((card, index) => {
      const number = String(index + 1).padStart(2, '0');

      const article = document.createElement('article');
      article.className = 'card';
      article.tabIndex = 0;
      article.setAttribute('role', 'button');
      article.setAttribute('aria-expanded', 'false');
      article.setAttribute('aria-label', `Flashcard ${number}: ${card.front}`);

      article.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-front">
            <span class="card-number">${number}</span>
            <h2>${card.front}</h2>
            <span class="flip-hint">Clique para virar</span>
          </div>
          <div class="card-face card-back">
            <span class="card-number">${number}</span>
            <p>${card.back}</p>
          </div>
        </div>
      `;

      // Eventos de clique e teclado
      const toggle = () => {
        article.classList.toggle('flipped');
        article.setAttribute('aria-expanded', article.classList.contains('flipped'));
      };

      article.addEventListener('click', toggle);
      article.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggle();
        }
      });

      grid.appendChild(article);
    });
  </script>
</body>
</html>
